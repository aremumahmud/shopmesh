version: 1
app:
  component: payments
  healthPath: /health
benchmarkMode:
  envVar: AIR_BENCHMARK_MODE
  tokenEnvVar: AIR_BENCHMARK_TOKEN
setup:
  seed:
    command: "node dist/src/airSeed.js --scale {scale}"
    scales: { small: 1, realistic: 10, large: 100 }
    expectedRows: { Charge: 1000 }
auth:
  strategy: none
# payments makes no outbound calls — no externalServices.
